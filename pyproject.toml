[project]
name = "gfetch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel Belouze", email = "gabriel@belouze.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.25.3",
    "odc-geo>=0.5.3",
    "odc-stac>=0.5.3",
    "omegaconf>=2.3.1",
    "pystac-client>=0.9.0",
    "retry>=0.9.2",
    "rich>=15.0.0",
    "stac-asset>=0.4.7",
    "zarr>=3.4.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
gfetch = "gfetch.cli.main:app"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "moto>=5.2.3",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "DOC",  # pydocstyle/pydoclint (docstring presence/shape)
    "PTH",  # flake8-use-pathlib
    "LOG",  # flake8-logging
    "INP",  # flake8-no-pep420
    "PIE",
    "T20",  # no stray print()
    "PT",   # pytest style
]
ignore = ["DOC501", "DOC201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["INP001"]

[tool.pydoclint]
style = "numpy"
skip-checking-raises = true
check-style-mismatch = true
ignore = ["DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow"]
log_cli = true
log_cli_level = "DEBUG"
log_level = "DEBUG"
